<!DOCTYPE html>
<html>
<head>
    <title>Smart Health and Kitchen Assistant</title>
    <link rel = "icon" href = "images/Gemini_Generated_Image_7rve5h7rve5h7rve.png">
    <link rel="stylesheet" href="css/additemmed.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <header class="top-navbar">
        <div class="logo">Medicine Inventory</div>
    </header>

    <div class="container">

        <div class="form-card">

            <h1>Add New Medicine</h1>
            <p class="subtitle">
                Enter the medicine details to keep track of your health inventory.
            </p>

            <form id="medicineForm">

                <div class="input-group">
                    <label>Medicine Name</label>
                    <input
                        type="text"
                        id="medicineName"
                        placeholder="Example: Paracetamol">
                </div>

                <div class="input-group">
                    <label>Medicine Type</label>
                    <select id="medicineType">
                        <option>Tablet</option>
                        <option>Capsule</option>
                        <option>Syrup</option>
                        <option>Injection</option>
                        <option>Ointment</option>
                        <option>Drops</option>
                        <option>Inhaler</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Brand Name</label>
                    <input 
                        type="text" 
                        id="brandName"
                        placeholder="Example: Dolo 650">
                </div>

                <div class="input-group">
                    <label>Quantity</label>
                    <input
                        type="number"
                        id="quantity"
                        placeholder="Enter Quantity"
                        min="1"
                        step="1"
                        required>
                </div>

                <div class="input-group">
                    <label>Dosage</label>
                    <input 
                        type="text" 
                        id="dosage"
                        placeholder="Example: 500 mg">
                </div>

                <div class="input-group">
                    <label>Purchase Date</label>
                    <input type="date" id="purchaseDate">
                </div>

                <div class="input-group">
                    <label>Expiry Date</label>
                    <input type="date" id="expiryDate">
                </div>

                <div class="input-group">
                    <label>Storage Location</label>
                    <select id="location">
                        <option>Medicine Box</option>
                        <option>Cabinet</option>
                        <option>Refrigerator</option>
                        <option>First Aid Kit</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Prescription Required</label>
                    <select id="prescription">
                        <option>No</option>
                        <option>Yes</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Low Stock Alert</label>
                    <input
                        type="number"
                        id="lowStock"
                        placeholder="Alert when quantity reaches"
                        min="1"
                        step="1"
                        required>
                </div>

                                <div class="input-group">
                    <label>⏰ Intake Reminder Time</label>
                    <input type="time" id="reminderTime" value="09:00">
                </div>

                <div class="input-group">
                    <label>Intake Frequency</label>
                    <select id="frequency">
                        <option value="Once Daily (Morning)">Once Daily (Morning)</option>
                        <option value="Once Daily (Evening)">Once Daily (Evening)</option>
                        <option value="Twice Daily (Morning & Evening)">Twice Daily (Morning & Evening)</option>
                        <option value="Three Times Daily">Three Times Daily</option>
                        <option value="Before Bedtime">Before Bedtime</option>
                        <option value="As Needed">As Needed</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Upload Medicine Image</label>
                    <input type="file">
                </div>

                <div class="input-group">
                    <label>Notes</label>
                    <textarea id="notes" placeholder="Any additional information..."></textarea>
                </div>

                <div class="buttons">
                    <button type="submit" class="save-btn">Save Medicine</button>
                    <button class="cancel-btn" type="reset">Cancel</button>
                </div>

            </form>

        </div>

    </div>
    <script src="javascript/additemmed.js"></script>
    <script src="javascript/nav.js"></script>
</body>
</html>
