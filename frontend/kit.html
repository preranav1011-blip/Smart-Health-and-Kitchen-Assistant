<!DOCTYPE html>
<html>
    <head>
        <title>Smart Health and Kitchen Assistant</title>
        <link rel = "icon" href = "images/Gemini_Generated_Image_7rve5h7rve5h7rve.png">
        <link rel="stylesheet" href="css/kit.css">
        <link rel="stylesheet" href="css/nav.css">
</head>
    <body>
        <header class="top-navbar">
            <div class="filter-container">

                <button class="filter-btn active" onclick="filterItems('all', this)">All</button>

                <button class="filter-btn" onclick="filterItems('fresh', this)">Fresh</button>

                <button class="filter-btn" onclick="filterItems('expiring', this)">Expiring Soon</button>

                <button class="filter-btn" onclick="filterItems('critical', this)">Critical</button>

                <button class="filter-btn" onclick="filterItems('expired', this)">Expired</button>

            </div>

            <div class="logo">Kitchen Inventory</div>
            <div class="search-container">
                <input type="text" id="search" placeholder="Search for items, categories, or expiry dates...">
                <button type="button" class="search-btn">Search</button>
            </div>
        </header>

        <div class="main-layout">
            <aside class="summary-panel">
                <h2>Inventory Summary</h2>
                <hr>
                <div class="stat-item">
                    <strong>Total Items:</strong>
                    <span id="total-items">0</span>
                </div>

                <div class="stat-item">
                    <strong>Low Stock:</strong>
                    <span id="low-stock">0</span>
                </div>

                <div class="stat-item">
                    <strong>Expired:</strong>
                    <span id="expired-items">0</span>
                </div>
            </aside>

            <main class="content-area">
                <p style="color: #666; font-style: italic;">Your inventory items will display here...</p>
            </main>
        </div>
        <!-- Floating Add Item Button -->
        <a href="additem.html">
            <button class="add-item-btn">
                <span class="plus-icon">+</span>
                <span>Add Item</span>
            </button>
        </a>
        <script src="javascript/kitchen.js">
            // alert("Item Added Successfully!");

            // window.location.href = "kit.html";
        </script>
        <script src="javascript/nav.js"></script>
</body>
</html>
