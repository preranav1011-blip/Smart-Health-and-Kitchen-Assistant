    <title>Smart Health and Kitchen Assistant</title>
    <link rel = "icon" href = "images/Gemini_Generated_Image_7rve5h7rve5h7rve.png">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<header class="top-navbar">

    <div class="logo">
        <i class="fa-solid fa-user"></i>
        My Profile
    </div>

</header>

<main class="container">

    <!-- Left Side -->

    <div class="profile-card">

        <img src="https://i.pravatar.cc/200" alt="Profile">

        <h2>John Doe</h2>

        <p>john@example.com</p>

        <button>Edit Profile</button>

    </div>


    <!-- Right Side -->

    <div class="details">

        <section class="info">

            <h2>Personal Information</h2>

            <div class="row">
                <label>Full Name</label>
                <input type="text" value="John Doe">
            </div>

            <div class="row">
                <label>Email</label>
                <input type="email" value="john@example.com">
            </div>

            <div class="row">
                <label>Phone</label>
                <input type="text" value="+91 9876543210">
            </div>

            <div class="row">
                <label>Age</label>
                <input type="number" value="22">
            </div>

        </section>


        <section class="stats">

            <div class="stat">
                <i class="fa-solid fa-utensils"></i>
                <h3>54</h3>
                <p>Kitchen Items</p>
            </div>

            <div class="stat">
                <i class="fa-solid fa-pills"></i>
                <h3>18</h3>
                <p>Medicines</p>
            </div>

            <div class="stat">
                <i class="fa-solid fa-bell"></i>
                <h3>9</h3>
                <p>Notifications</p>
            </div>

            <div class="stat">
                <i class="fa-solid fa-heart-pulse"></i>
                <h3>96%</h3>
                <p>Health Score</p>
            </div>

        </section>


        <section class="actions">

            <button class="save">
                <i class="fa-solid fa-floppy-disk"></i>
                Save Changes
            </button>

            <button class="logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </section>

    </div>

</main>

</body>
</html>
