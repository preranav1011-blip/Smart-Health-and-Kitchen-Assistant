    <link rel="stylesheet" href="css/settings.css">

</head>

<body>

<header class="top-navbar">

    <div class="logo">
        <i class="fa-solid fa-gear"></i>
        Settings
    </div>

</header>

<main class="container">

    <!-- Notifications -->

    <div class="setting-card">

        <h2><i class="fa-solid fa-bell"></i> Notifications</h2>

        <div class="option">
            <label>Expiry Notifications</label>
            <input type="checkbox" checked>
        </div>

        <div class="option">
            <label>Medicine Reminders</label>
            <input type="checkbox" checked>
        </div>

        <div class="option">
            <label>Recipe Suggestions</label>
            <input type="checkbox">
        </div>

    </div>


    <!-- Appearance -->

    <div class="setting-card">

        <h2><i class="fa-solid fa-palette"></i> Appearance</h2>

        <div class="option">
            <label>Theme</label>

            <select>
                <option>Light</option>
                <option>Dark</option>
                <option>System Default</option>
            </select>
        </div>

        <div class="option">
            <label>Font Size</label>

            <select>
                <option>Small</option>
                <option selected>Medium</option>
                <option>Large</option>
            </select>
        </div>

    </div>


    <!-- Language -->

    <div class="setting-card">

        <h2><i class="fa-solid fa-language"></i> Language</h2>

        <div class="option">

            <label>Application Language</label>

            <select>
                <option>English</option>
                <option>Hindi</option>
                <option>Telugu</option>
            </select>

        </div>

    </div>


    <!-- Privacy -->

    <div class="setting-card">

        <h2><i class="fa-solid fa-shield-halved"></i> Privacy & Security</h2>

        <div class="option">
            <label>Enable Two-Factor Authentication</label>
            <input type="checkbox">
        </div>

        <div class="option">
            <label>Auto Logout After 15 Minutes</label>
            <input type="checkbox">
        </div>

        <button class="change-password">
            Change Password
        </button>

    </div>


    <!-- Save -->

    <div class="buttons">

        <button class="save-btn">
            <i class="fa-solid fa-floppy-disk"></i>
            Save Settings
        </button>

        <button class="reset-btn">
            <i class="fa-solid fa-rotate-left"></i>
            Reset
        </button>

    </div>

</main>

    <script src="javascript/nav.js"></script>
</body>
</html>
