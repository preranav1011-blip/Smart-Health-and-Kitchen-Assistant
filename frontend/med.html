<!DOCTYPE html>
<html>
    <head>
        <title>Smart Health and Kitchen Assistant</title>
        <link rel = "icon" href = "images/Gemini_Generated_Image_7rve5h7rve5h7rve.png">
        <link rel="stylesheet" href="css/med.css">
        <link rel="stylesheet" href="css/nav.css">
</head>
    <body>
        <header class="top-navbar">
            <div class="logo">
                <span class="med-icon">✚</span> MedStock IQ
            </div>
            <div class="search-container">
                <input type="text" id="search" placeholder="Search by generic name, brand, batch ID, or location...">
                <button type="button" class="search-btn">Search</button>
            </div>
        </header>

        <div class="main-layout">
            <aside class="summary-panel">
                <h2>Inventory Summary</h2>
                <hr>

                <div class="stat-item filter-item active-filter" id="all-filter"
                    onclick="filterMedicines('all', this)">
                    <strong>Total SKUs:</strong>
                    <span id="total-skus">0</span>
                </div>

                <div class="stat-item filter-item"
                    onclick="filterMedicines('lowstock', this)">
                    <strong>Low Stock:</strong>
                    <span id="low-stock">0</span>
                </div>

                <div class="stat-item critical filter-item"
                    onclick="filterMedicines('critical', this)">
                    <strong>Critical (&lt;=2 Days):</strong>
                    <span id="critical-medicines">0</span>
                </div>

                <div class="stat-item warning filter-item"
                    onclick="filterMedicines('expiring', this)">
                    <strong>Expiring Soon:</strong>
                    <span id="expiring-medicines">0</span>
                </div>

                <div class="stat-item alert filter-item"
                    onclick="filterMedicines('expired', this)">
                    <strong>Expired Batches:</strong>
                    <span id="expired-medicines">0</span>
                </div>

                <div class="stat-item filter-item"
                    onclick="filterMedicines('safe', this)">
                    <strong>Safe Medicines:</strong>
                    <span id="safe-medicines">0</span>
                </div>

                <div class="stat-item filter-item">
                    <strong>Controlled Substances:</strong>
                    <span id="controlled-substances">0</span>
                </div>

            </aside>

            <main class="content-area">
                <p style="color: #6c757d; font-style: italic;">Select a category or search above to view current pharmaceutical stock levels...</p>
            </main>
        </div>

        <!-- Floating Add Stock Button -->
        <button class="add-item-btn" id="addMedicineBtn">
            <span class="plus-icon">+</span>
            <span>Log New Batch</span>
        </button>
        <script src="javascript/medicine.js"></script>
        <script src="javascript/nav.js"></script>
</body>
</html>
