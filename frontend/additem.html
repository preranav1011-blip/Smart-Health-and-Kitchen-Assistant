<!DOCTYPE html>
<html>
<head>
    <title>Smart Health and Kitchen Assistant</title>
    <link rel = "icon" href = "images/Gemini_Generated_Image_7rve5h7rve5h7rve.png">
    <link rel="stylesheet" href="css/additem.css">
</head>
<body>

    <header class="top-navbar">
        <div class="logo">Kitchen Inventory</div>
    </header>

    <div class="container">

        <div class="form-card">
            <h1>Add New Item</h1>
            <p class="subtitle">Fill in the details below to add an item to your inventory.</p>

            <form>

                <div class="input-group">
                    <label>Item Name</label>
                    <input type="text" placeholder="Example: Milk">
                </div>

                <div class="input-group">
                    <label>Category</label>
                    <select>
                        <option>Vegetables</option>
                        <option>Fruits</option>
                        <option>Dairy</option>
                        <option>Spices</option>
                        <option>Snacks</option>
                        <option>Beverages</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Quantity</label>
                    <input type="number" placeholder="Enter Quantity">
                </div>

                <div class="input-group">
                    <label>Unit</label>
                    <select>
                        <option>kg</option>
                        <option>g</option>
                        <option>L</option>
                        <option>ml</option>
                        <option>Pieces</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Purchase Date</label>
                    <input type="date">
                </div>

                <div class="input-group">
                    <label>Expiry Date</label>
                    <input type="date">
                </div>

                <div class="input-group">
                    <label>Upload Item Image</label>
                    <input type="file">
                </div>

                <div class="buttons">
                    <button class="save-btn">Save Item</button>
                    <button class="cancel-btn" type="reset">Cancel</button>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
