<!DOCTYPE html>
<html>
<head>
    <title>Smart Health and Kitchen Assistant</title>
    <link rel = "icon" href = "images/Gemini_Generated_Image_7rve5h7rve5h7rve.png">
    <link rel="stylesheet" href="css/additem.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <header class="top-navbar">
        <div class="logo">Kitchen Inventory</div>
    </header>

    <div class="container">
        <div class="form-card">
            <h1>Add New Item</h1>
            <p class="subtitle">Fill in the details below to add an item to your inventory.</p>

            <form id="addItemForm">

                <div class="input-group">
                    <label>Item Name</label>
                    <input type="text" id="itemName" placeholder="Example: Milk">
                </div>

                <div class="input-group">
                    <label>Category</label>
                    <select id="category">
                        <option>Vegetables</option>
                        <option>Fruits</option>
                        <option>Dairy</option>
                        <option>Spices</option>
                        <option>Snacks</option>
                        <option>Beverages</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Quantity</label>
                    <input type="number" id="quantity" placeholder="Enter Quantity">
                </div>

                <div class="input-group">
                    <label>Unit</label>
                    <select id="unit">
                        <option>kg</option>
                        <option>g</option>
                        <option>L</option>
                        <option>ml</option>
                        <option>Pieces</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Purchase Date</label>
                    <input type="date" id="purchaseDate">
                </div>

                <div class="input-group">
                    <label>Expiry Date</label>
                    <input type="date" id="expiryDate">
                </div>

                <div class="input-group">
                    <label>Upload Item Image</label>
                    <input type="file" id="image">
                </div>

                <div class="buttons">
                    <button type="submit" class="save-btn">Save Item</button>
                    <button class="cancel-btn" type="reset">Cancel</button>
                </div>

            </form>

        </div>

    </div>
    <script src="javascript/additem.js"></script>

    <script src="javascript/nav.js"></script>
</body>
</html>
