<!DOCTYPE html>
<html lang="en">
<head>

    <title>Smart Health and Kitchen Assistant</title>
    <link rel = "icon" href = "images/Gemini_Generated_Image_7rve5h7rve5h7rve.png">
    <link rel="stylesheet" href="css/yourcart.css">
</head>

<body>

<header class="top-navbar">

    <div class="logo">
        <i class="fa-solid fa-cart-shopping"></i>
        Your Cart
    </div>

    <button class="add-btn">
        <i class="fa-solid fa-plus"></i>
        Add Item
    </button>

</header>

<main>

    <!-- Summary Cards -->

    <section class="summary">

        <div class="card">
            <i class="fa-solid fa-list-check"></i>
            <h2>12</h2>
            <p>Total Items</p>
        </div>

        <div class="card">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h2>5</h2>
            <p>Low Stock</p>
        </div>

        <div class="card">
            <i class="fa-solid fa-check-circle"></i>
            <h2>7</h2>
            <p>Purchased</p>
        </div>

    </section>

    <!-- Shopping List -->

    <section class="shopping-list">

        <h2>Items to Buy</h2>

        <div class="item">
            <input type="checkbox">

            <div class="details">
                <h3>Milk</h3>
                <p>Quantity: 2 Litres</p>
            </div>

            <span class="priority high">High</span>
        </div>

        <div class="item">
            <input type="checkbox">

            <div class="details">
                <h3>Rice</h3>
                <p>Quantity: 5 Kg</p>
            </div>

            <span class="priority medium">Medium</span>
        </div>

        <div class="item">
            <input type="checkbox">

            <div class="details">
                <h3>Eggs</h3>
                <p>Quantity: 12 Pieces</p>
            </div>

            <span class="priority high">High</span>
        </div>

        <div class="item">
            <input type="checkbox">

            <div class="details">
                <h3>Paracetamol</h3>
                <p>Quantity: 1 Strip</p>
            </div>

            <span class="priority low">Low</span>
        </div>

        <div class="item">
            <input type="checkbox">

            <div class="details">
                <h3>Cooking Oil</h3>
                <p>Quantity: 2 Litres</p>
            </div>

            <span class="priority medium">Medium</span>
        </div>

    </section>

</main>

</body>
</html>
