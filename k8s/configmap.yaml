apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: smart-health
data:
  FLASK_ENV: "production"
  PORT: "5000"
  MYSQL_HOST: "mysql-service"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "smart_health_db"
  DATABASE_URL: "mysql+pymysql://assistant_user:assistant_pass@mysql-service:3306/smart_health_db"
